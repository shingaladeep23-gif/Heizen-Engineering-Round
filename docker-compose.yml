# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fernleaf
      POSTGRES_PASSWORD: fernleaf
      POSTGRES_DB: fernleaf
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
